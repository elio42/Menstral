[project]
name = "menstral"
version = "0.1.0"
description = "Ovumcy cycle-transformer training repo (Plan B): daily-tensor corpus, baselines, TTM / PatchTST spikes, per-person adapters, ONNX export + FastAPI sidecar."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elio Kuster" }]
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-dateutil>=2.9",
  "scipy>=1.12",
]
# Heavy training deps are optional so `pip install -e .` stays fast for
# sidecar-only use. Full training adds them via the `train` extra.
#   pip install -e ".[train]"      # torch CPU + HF + ONNX + eval
# Torch CPU wheel: use the CPU index (see README):
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
# Track A additionally needs IBM's toolkit (NOT PyPI granite-tsfm, which is an
# unrelated placeholder):
#   pip install "git+https://github.com/ibm-granite/granite-timeseries"

[project.optional-dependencies]
train = [
  "torch>=2.3",
  "onnx>=1.17",
  "onnxruntime>=1.18",
  "transformers>=4.41",
  "datasets>=2.19",
  "scikit-learn>=1.4",
]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.4",
]

[project.scripts]
menstral-tensor = "scripts.build_tensors:main"
menstral-baseline = "scripts.train_baseline:main"
menstral-serve = "src.ovumcy_serve.app:serve"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
